<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Qibla</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕋</text></svg>">
<style>
    body { 
        background: #1a1a1a; 
        color: white; 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        justify-content: center; 
        height: 100vh; 
        margin: 0; 
        overflow: hidden;
    }
    
    .header-section { text-align: center; margin-bottom: 5vh; }
    .tagline { color: #888; font-style: italic; font-size: 14px; margin-top: 5px; }

    /* Compass Background */
    .compass { 
        width: 80vw; 
        height: 80vw; 
        max-width: 350px; 
        max-height: 350px;
        border: 8px solid #333; 
        border-radius: 50%; 
        position: relative; 
        background: radial-gradient(#222, #111);
        box-shadow: 0 0 30px rgba(0,0,0,0.5);
    }

    /* Dial wrapper that will rotate */
    .dial {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
    }

    /* Subtle degree ticks on the edge */
    .ticks {
        position: absolute;
        width: 100%; 
        height: 100%;
        border-radius: 50%;
        background: repeating-conic-gradient(
            from -0.5deg,
            rgba(255, 255, 255, 0.15) 0deg 1deg,
            transparent 1deg 5deg
        );
        /* Masks the center so ticks only appear on the outer edge */
        -webkit-mask-image: radial-gradient(transparent 82%, black 83%);
        mask-image: radial-gradient(transparent 82%, black 83%);
    }

    /* Direction labels */
    .label {
        position: absolute;
        font-weight: bold;
        font-size: 5vw; 
        color: #888;
        width: 30px;
        text-align: center;
        z-index: 2;
    }
    @media (min-width: 500px) { .label { font-size: 22px; } }

    .n { top: 15px; left: calc(50% - 15px); color: #ff4444; }
    .s { bottom: 15px; left: calc(50% - 15px); }
    .e { right: 15px; top: calc(50% - 11px); }
    .w { left: 15px; top: calc(50% - 11px); }

    /* Qibla Needle Body */
    .arrow { 
        width: 5px; 
        height: 30%;
        background: #00ff7f; 
        position: absolute; 
        top: 20%;
        left: calc(50% - 2.5px); 
        transform-origin: bottom center; 
        z-index: 10;
        border-radius: 5px;
    }

    /* Qibla Needle Head */
    .arrow::before { 
        content: ''; 
        position: absolute; 
        top: -15px; 
        left: -7.5px; 
        border-left: 10px solid transparent; 
        border-right: 10px solid transparent; 
        border-bottom: 20px solid #00ff7f; 
    }

    button { 
        padding: 15px 35px; 
        font-size: 18px; 
        background: #00ff7f; 
        color: black; 
        border: none; 
        border-radius: 50px; 
        cursor: pointer; 
        font-weight: bold; 
        margin-top: 30px;
        box-shadow: 0 4px 15px rgba(0,255,127,0.3); 
    }
    
    #log { 
        font-size: 14px; 
        color: #aaa; 
        margin-top: 15px; 
        text-align: center; 
        max-width: 85%; 
        line-height: 1.5;
    }
</style>
</head>
<body>

    <h2 style="color: #00ff7f; margin-bottom: 20px;">Qibla Finder</h2>

    <div class="compass">
        <div id="dial" class="dial">
            <div class="ticks"></div>
            <div class="label n">N</div>
            <div class="label e">E</div>
            <div class="label s">S</div>
            <div class="label w">W</div>
        </div>
        
        <div id="needle" class="arrow"></div>
    </div>

    <button id="btn">Activate Compass</button>
    <div id="log">
        Qibla will be shown according to your location.<br>
        <span style="font-size: 11px; color: #777; display: block; margin-top: 8px;">
            Privacy Note: We do not track or save your location. All calculations are securely performed on your device.
        </span>
    </div>

    <script>
        const kaaba = { lat: 21.422487, lng: 39.826206 };
        let qiblaDeg = 0;
        const btn = document.getElementById('btn');
        const log = document.getElementById('log');
        const needle = document.getElementById('needle');
        const dial = document.getElementById('dial'); // Getting the dial element

        function getQibla(lat, lng) {
            const phi1 = lat * Math.PI / 180;
            const phi2 = kaaba.lat * Math.PI / 180;
            const delL = (kaaba.lng - lng) * Math.PI / 180;
            const y = Math.sin(delL);
            const x = Math.cos(phi1) * Math.tan(phi2) - Math.sin(phi1) * Math.cos(delL);
            return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
        }

        btn.onclick = async () => {
            // iOS Sensor Permission
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    if (permission === 'granted') {
                        setupCompass();
                    } else {
                        alert("Sensor Permission needed.");
                    }
                } catch (e) {
                    alert("Error: " + e);
                }
            } else {
                setupCompass();
            }

            // Location Access
            navigator.geolocation.getCurrentPosition(pos => {
                qiblaDeg = getQibla(pos.coords.latitude, pos.coords.longitude);
                log.innerHTML = `Qibla: <b>${Math.round(qiblaDeg)}°</b> (from North)<br>Hold phone flat and rotate to find Qibla.`;
                btn.style.display = 'none';
            }, err => {
                alert("Turn on location.");
            });
        };

        function setupCompass() {
            const handler = (e) => {
                let heading = e.webkitCompassHeading || (360 - e.alpha);
                if (heading) {
                    // Rotate the dial to always point 'N' to the real North
                    dial.style.transform = `rotate(${-heading}deg)`;
                    
                    // Rotate the needle to point to Qibla
                    let rotate = qiblaDeg - heading;
                    needle.style.transform = `rotate(${rotate}deg)`;
                }
            };
            window.addEventListener('deviceorientation', handler, true);
            window.addEventListener('deviceorientationabsolute', handler, true);
        }
    </script>
</body>
</html>
