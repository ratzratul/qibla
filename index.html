<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qibla</title>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        .compass { width: 280px; height: 280px; border: 8px solid #444; border-radius: 50%; position: relative; background: radial-gradient(#222, #000); box-shadow: 0 0 30px rgba(0,255,127,0.1); }
        .arrow { width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-bottom: 100px solid #00ff7f; position: absolute; top: 50%; left: 50%; transform-origin: bottom center; transform: translate(-50%, -100%) rotate(0deg); transition: transform 0.1s ease-out; }
        .label { position: absolute; font-weight: bold; color: #666; font-size: 20px; }
        .n { top: 10px; left: 50%; transform: translateX(-50%); color: #ff4444; }
        #status { margin-top: 25px; padding: 0 20px; font-size: 14px; color: #aaa; line-height: 1.5; }
        button { padding: 15px 30px; font-size: 18px; background: #00ff7f; color: black; border: none; border-radius: 50px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(0,255,127,0.3); }
        button:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <h2 style="margin-bottom: 30px;">Qibla Finder</h2>

    <div class="compass">
        <div class="label n">N</div>
        <div class="arrow" id="qiblaArrow"></div>
    </div>
    
    <div id="controls" style="margin-top: 30px;">
        <button onclick="initApp()">Activate Compass</button>
    </div>

    <p id="status">Allow permission</p>

    <script>
        const kaaba = { lat: 21.422487, lng: 39.826206 };
        let qiblaAngle = 0;

        function getQibla(lat, lng) {
            const phi1 = lat * Math.PI / 180;
            const phi2 = kaaba.lat * Math.PI / 180;
            const delL = (kaaba.lng - lng) * Math.PI / 180;
            const y = Math.sin(delL);
            const x = Math.cos(phi1) * Math.tan(phi2) - Math.sin(phi1) * Math.cos(delL);
            return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
        }

        async function initApp() {
            const status = document.getElementById('status');
            
            // ১. লোকেশন নেওয়া
            navigator.geolocation.getCurrentPosition(pos => {
                qiblaAngle = getQibla(pos.coords.latitude, pos.coords.longitude);
                status.innerText = "লোকেশন পাওয়া গেছে। এবার ফোনটি স্থির রাখুন।";
                document.getElementById('controls').style.display = 'none';

                // ২. কম্পাস সেন্সর অ্যাক্টিভেট করা
                startSensor();
            }, err => {
                status.innerText = "লোকেশন পাওয়া যায়নি। দয়া করে GPS অন করুন।";
            });
        }

        function startSensor() {
            const arrow = document.getElementById('qiblaArrow');
            const status = document.getElementById('status');

            // iOS (iPhone) এর জন্য বিশেষ পারমিশন
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(res => {
                    if (res === 'granted') {
                        window.addEventListener('deviceorientation', (e) => updateCompass(e, arrow));
                    }
                }).catch(err => status.innerText = "সেন্সর পারমিশন রিজেক্ট করা হয়েছে।");
            } else {
                // Android বা অন্যান্য ব্রাউজার
                window.addEventListener('deviceorientationabsolute', (e) => updateCompass(e, arrow), true);
                // যদি absolute না থাকে তবে সাধারণটা ট্রাই করবে
                window.addEventListener('deviceorientation', (e) => {
                    if (!e.absolute && !e.webkitCompassHeading) return;
                    updateCompass(e, arrow);
                }, true);
            }
        }

        function updateCompass(event, arrow) {
            let heading = 0;

            if (event.webkitCompassHeading) {
                // iOS এর জন্য
                heading = event.webkitCompassHeading;
            } else if (event.alpha !== null) {
                // Android এর জন্য (এটি মূলত উল্টো ভ্যালু দেয় তাই ঠিক করে নেওয়া)
                heading = 360 - event.alpha;
            }

            // কিবলার এঙ্গেল থেকে ফোনের মুখ বিয়োগ করলে তীর সবসময় কাবার দিকে থাকবে
            const finalRotation = qiblaAngle - heading;
            arrow.style.transform = `translate(-50%, -100%) rotate(${finalRotation}deg)`;
            
            document.getElementById('status').innerText = `কাবা: ${Math.round(qiblaAngle)}° | ফোন মুখ করে আছে: ${Math.round(heading)}°`;
        }
    </script>
</body>
</html>
