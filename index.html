<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Qibla</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕋</text></svg>">
    <style>
        body { background: #1a1a1a; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        
        .compass { 
            width: 280px; 
            height: 280px; 
            border: 8px solid #333; 
            border-radius: 50%; 
            position: relative; 
            margin-bottom: 20px; 
            background: radial-gradient(#222, #111);
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        /* দিক নির্দেশক লেখাগুলো */
        .label {
            position: absolute;
            font-weight: bold;
            font-size: 18px;
            color: #888;
            width: 30px;
            text-align: center;
        }
        .n { top: 10px; left: calc(50% - 15px); color: #ff4444; } /* উত্তর লাল রঙ */
        .s { bottom: 10px; left: calc(50% - 15px); }
        .e { right: 10px; top: calc(50% - 10px); }
        .w { left: 10px; top: calc(50% - 10px); }

        /* কিবলার জন্য সবুজ দাগ */
        .arrow { 
            width: 6px; 
            height: 110px; 
            background: #00ff7f; 
            position: absolute; 
            top: 30px; 
            left: calc(50% - 3px); 
            transform-origin: bottom center; 
            z-index: 10;
            border-radius: 5px;
            transition: transform 0.2s ease-out; /* কাঁটা নড়া স্মুথ করবে */
        }
        /* তীরের মাথা */
        .arrow::before { 
            content: ''; 
            position: absolute; 
            top: -12px; 
            left: -7px; 
            border-left: 10px solid transparent; 
            border-right: 10px solid transparent; 
            border-bottom: 18px solid #00ff7f; 
        }

        button { padding: 15px 30px; font-size: 18px; background: #00ff7f; color: black; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 15px rgba(0,255,127,0.3); }
        #log { font-size: 14px; color: #aaa; margin-top: 15px; text-align: center; max-width: 80%; }
    </style>
</head>
<body>

    <h2 style="color: #00ff7f; margin-bottom: 20px;">Qibla Finder</h2>

    <div class="compass">
        <div class="label n">N</div>
        <div class="label e">E</div>
        <div class="label s">S</div>
        <div class="label w">W</div>
        
        <div id="needle" class="arrow"></div>
    </div>

    <button id="btn">Activate Compass</button>
    <div id="log">Qibla will be shown according your location</div>

    <script>
        const kaaba = { lat: 21.422487, lng: 39.826206 };
        let qiblaDeg = 0;
        const btn = document.getElementById('btn');
        const log = document.getElementById('log');
        const needle = document.getElementById('needle');

        function getQibla(lat, lng) {
            const phi1 = lat * Math.PI / 180;
            const phi2 = kaaba.lat * Math.PI / 180;
            const delL = (kaaba.lng - lng) * Math.PI / 180;
            const y = Math.sin(delL);
            const x = Math.cos(phi1) * Math.tan(phi2) - Math.sin(phi1) * Math.cos(delL);
            return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
        }

        btn.onclick = async () => {
            // iOS Sensor Permission
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    if (permission === 'granted') {
                        setupCompass();
                    } else {
                        alert("Sensor Permission needed.");
                    }
                } catch (e) {
                    alert("Error: " + e);
                }
            } else {
                setupCompass();
            }

            // Location Access
            navigator.geolocation.getCurrentPosition(pos => {
                qiblaDeg = getQibla(pos.coords.latitude, pos.coords.longitude);
                log.innerHTML = `Qibla: <b>${Math.round(qiblaDeg)}°</b> (from North)<br>ফোনটি আনুভূমিকভাবে ধরে ডানে-বামে ঘোরান।`;
                btn.style.display = 'none';
            }, err => {
                alert("Turn on location.");
            });
        };

        function setupCompass() {
            const handler = (e) => {
                let heading = e.webkitCompassHeading || (360 - e.alpha);
                if (heading) {
                    // কিবলা ক্যালকুলেশন
                    let rotate = qiblaDeg - heading;
                    needle.style.transform = `rotate(${rotate}deg)`;
                }
            };
            window.addEventListener('deviceorientation', handler, true);
            window.addEventListener('deviceorientationabsolute', handler, true);
        }
    </script>
</body>
</html>
