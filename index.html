<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>কিবলা কম্পাস</title>
    <style>
        body { background: #1a1a1a; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .compass { width: 250px; height: 250px; border: 5px solid #555; border-radius: 50%; position: relative; margin-bottom: 20px; }
        .arrow { width: 4px; height: 100px; background: #00ff7f; position: absolute; top: 25px; left: 123px; transform-origin: bottom center; }
        .arrow::before { content: ''; position: absolute; top: -10px; left: -8px; border-left: 10px solid transparent; border-right: 10px solid transparent; border-bottom: 15px solid #00ff7f; }
        button { padding: 15px 30px; font-size: 18px; background: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer; }
        #log { font-size: 12px; color: #888; margin-top: 10px; padding: 0 10px; text-align: center; }
    </style>
</head>
<body>

    <div class="compass">
        <div id="needle" class="arrow"></div>
    </div>

    <button id="btn">কম্পাস চালু করুন</button>
    <div id="log">লোকেশন ও সেন্সর পারমিশন প্রয়োজন</div>

    <script>
        const kaaba = { lat: 21.422487, lng: 39.826206 };
        let qiblaDeg = 0;
        const btn = document.getElementById('btn');
        const log = document.getElementById('log');
        const needle = document.getElementById('needle');

        function getQibla(lat, lng) {
            const phi1 = lat * Math.PI / 180;
            const phi2 = kaaba.lat * Math.PI / 180;
            const delL = (kaaba.lng - lng) * Math.PI / 180;
            const y = Math.sin(delL);
            const x = Math.cos(phi1) * Math.tan(phi2) - Math.sin(phi1) * Math.cos(delL);
            return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
        }

        // বাটন ক্লিক করলে সরাসরি সেন্সর রিকোয়েস্ট
        btn.onclick = async () => {
            // ১. সেন্সর পারমিশন (iOS এর জন্য সবচেয়ে গুরুত্বপূর্ণ)
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    if (permission === 'granted') {
                        setupCompass();
                    } else {
                        alert("সেন্সর পারমিশন রিজেক্ট করা হয়েছে। সেটিংস থেকে সাফারির ডেটা ক্লিয়ার করুন।");
                    }
                } catch (e) {
                    alert("Error: " + e);
                }
            } else {
                // অ্যান্ড্রয়েড বা পিসির জন্য
                setupCompass();
            }

            // ২. লোকেশন নেওয়া
            navigator.geolocation.getCurrentPosition(pos => {
                qiblaDeg = getQibla(pos.coords.latitude, pos.coords.longitude);
                log.innerText = "কিবলা: " + Math.round(qiblaDeg) + "° এ। ফোন ঘুরিয়ে কিবলা খুঁজুন।";
                btn.style.display = 'none';
            }, err => {
                alert("লোকেশন পাওয়া যায়নি। দয়া করে GPS অন করুন।");
            });
        };

        function setupCompass() {
            const handler = (e) => {
                let heading = e.webkitCompassHeading || (360 - e.alpha);
                if (heading) {
                    let rotate = qiblaDeg - heading;
                    needle.style.transform = `rotate(${rotate}deg)`;
                }
            };
            
            window.addEventListener('deviceorientation', handler, true);
            window.addEventListener('deviceorientationabsolute', handler, true);
        }
    </script>
</body>
</html>
